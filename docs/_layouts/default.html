<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} - Sota Messenger</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2933;
      --muted: #52606d;
      --link: #2457c5;
      --border: #d9e2ec;
      --code: #f0f4f8;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --fg: #f3f4f6;
        --muted: #cbd5e1;
        --link: #8ab4ff;
        --border: #374151;
        --code: #1f2937;
      }
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.6;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    h1, h2, h3 {
      line-height: 1.25;
    }

    h1 {
      margin-top: 0;
    }

    a {
      color: var(--link);
    }

    code, pre {
      background: var(--code);
      border-radius: 6px;
    }

    code {
      padding: 0.1em 0.3em;
    }

    pre {
      overflow-x: auto;
      padding: 14px;
      border: 1px solid var(--border);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    .nav {
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 14px;
    }

    .nav a {
      margin-right: 12px;
    }
  </style>
</head>
<body>
  <main>
    <nav class="nav">
      <a href="./">Home</a>
      <a href="./privacy.html">Privacy</a>
      <a href="./terms.html">Terms</a>
      <a href="./delete-data.html">Data deletion</a>
      <a href="./permissions.html">Permissions</a>
    </nav>
    {{ content }}
  </main>
</body>
</html>
